# Defaults to READ-ONLY preflight. --run is a separately approved motion step.
services:
  collector:
    environment:
      LEADER_CALIBRATION_RELATIVE: "${LEADER_CALIBRATION_RELATIVE:-teleoperators/so101_leader/cup_leader.json}"
    devices:
      - "${LEADER_PORT:?Identify leader}:/dev/so101-leader:rw"
      - "${FOLLOWER_PORT:?Identify follower}:/dev/so101-follower:rw"
    group_add:
      - "${SERIAL_GID:?Set serial group ID}"
    volumes:
      - type: bind
        source: ./scripts/gripper_contact.py
        target: /opt/gripper_contact.py
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./calibration
        target: /calibration
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./scripts/teleop_check.py
        target: /opt/teleop_check.py
        read_only: true
        bind:
          create_host_path: false
    command: [python, /opt/teleop_check.py]
