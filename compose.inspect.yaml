# Explicitly approved register inspection only. No cameras or torque commands.
services:
  collector:
    devices:
      - "${LEADER_PORT:?Identify leader}:/dev/so101-leader:rw"
      - "${FOLLOWER_PORT:?Identify follower}:/dev/so101-follower:rw"
    group_add:
      - "${SERIAL_GID:?Set serial device group ID}"
    volumes:
      - type: bind
        source: ./scripts/inspect_motor_calibration.py
        target: /opt/inspect_motor_calibration.py
        read_only: true
        bind:
          create_host_path: false
    command: [python, /opt/inspect_motor_calibration.py]
