# Isolated follower-gripper powered test; no leader or camera devices.
services:
  collector:
    devices:
      - "${FOLLOWER_PORT:?Identify follower}:/dev/so101-follower:rw"
    group_add:
      - "${SERIAL_GID:?Set serial group ID}"
    volumes:
      - type: bind
        source: ./calibration
        target: /calibration
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./scripts/test_follower_gripper.py
        target: /opt/test_follower_gripper.py
        read_only: true
        bind:
          create_host_path: false
    command: [python, /opt/test_follower_gripper.py]
