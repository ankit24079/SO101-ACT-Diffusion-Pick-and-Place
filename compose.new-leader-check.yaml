# Read-only manual inspection of replacement leader; follower not mapped.
services:
  collector:
    devices:
      - "${LEADER_PORT:?Identify replacement leader}:/dev/so101-leader:rw"
    group_add:
      - "${SERIAL_GID:?Set serial group ID}"
    volumes:
      - type: bind
        source: ./scripts/check_new_leader.py
        target: /opt/check_new_leader.py
        read_only: true
        bind:
          create_host_path: false
    command: [python, /opt/check_new_leader.py]
