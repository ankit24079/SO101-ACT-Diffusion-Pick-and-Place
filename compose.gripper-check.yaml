# Follower serial only. Read-only register requests, no motor configuration.
services:
  collector:
    devices:
      - "${FOLLOWER_PORT:?Identify follower}:/dev/so101-follower:rw"
    group_add:
      - "${SERIAL_GID:?Set serial group ID}"
    volumes:
      - type: bind
        source: ./scripts/check_gripper_range.py
        target: /opt/check_gripper_range.py
        read_only: true
        bind:
          create_host_path: false
    command: [python, /opt/check_gripper_range.py]
